name: xtt suite

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * *"  # daily against fresh bizhuka/xtt master
  workflow_dispatch:
    inputs:
      xtt_repo:
        description: "xtt repository to test (URL)"
        default: "https://github.com/bizhuka/xtt"
      xtt_ref:
        description: "branch or tag of xtt to test"
        default: ""

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm run deps
        env:
          XTT_REPO: ${{ github.event.inputs.xtt_repo || 'https://github.com/bizhuka/xtt' }}
          XTT_REF: ${{ github.event.inputs.xtt_ref || '' }}
      - run: npm run build
      - name: run xtt's own unit tests
        run: npm test
      - name: run xtt feature suite
        run: |
          npm run suite | tee suite.log
          grep -q "ALL XTT SUITE TESTS PASSED" suite.log
      - name: merge every xtt demo template (make_all)
        run: |
          npm run make_all | tee make_all.log
          grep -q "ALL XTT DEMO TEMPLATES MERGED" make_all.log
      - name: upload merged demo files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xtt-demo-results
          path: output/result/
          if-no-files-found: ignore
